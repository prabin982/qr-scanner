databases:
  - name: qr-invite-db
    plan: free
    databaseName: qr_invite

services:
  - type: web
    name: qr-invite-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qr-invite-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # you type this in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false        # your Vercel URL, e.g. https://my-app.vercel.app
